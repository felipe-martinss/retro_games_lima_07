<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Jogos Retro 🕹️</h1>
        <p>Venda de jogos retro!</p>
        </header>
        <main class = "container">
            <div class="titulo-secao">
                <div>
                    <h2>Nosso catalogo</h2>
                    <p>Conheça os jogos disponíveis</p>
                </div>
                <button id="btnCadastrar" type="button"> + Cadastrar Jogo
                </button>
            </div>
            <section id="listarJogos" class="listar-jogos">
                <p id="mensagemVazia">Nenhum jogo cadastrado</p>
            </section>
        </main>
        <dialog id="modalCadastro">
            <h2>Novo Jogo</h2>
            <form id="formJogo">
                <label for="jogo">Nome do jogo</label>
                <input type="text" id="jogo" required>
                <label for="desenvolvedor"> Desenvolvedor </label>
                <input type="text" id="desenvolvedor" required>

                <label for="plataforma">Plataforma do jogo</label>
                <input type="text" id="plataforma" required>

                <label for="imagem">URL da imagem do jogo</label>
                <input type="url" id="imagem" placeholder="https://site.com/capa.jpg" required>

                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" min="0.01" step="0.01" required>
                <div class="acoes">
                    <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                    <button type="submit">Salvar jogo</button>
                </div>
            </form>
        </dialog>
        <script src="script.js"></script>
</body>
</html>
